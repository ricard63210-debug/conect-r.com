<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Conect-R | Websites, Social Media & Custom Systems</title>
    <meta name="description" content="Custom websites, social media management, and custom systems or apps for businesses in any industry, including food businesses. One trusted team." />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Conect-R" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_US" />
    <meta property="og:url" content="https://www.conect-r.com/" />
    <meta property="og:title" content="Conect-R | Websites, Social Media & Custom Systems" />
    <meta property="og:description" content="Custom websites, social media management, and custom systems or apps for businesses in any industry, including food businesses. One trusted team." />
    <meta property="og:image" content="https://www.conect-r.com/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Conect-R — Your business deserves more than a webpage" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Conect-R | Websites, Social Media & Custom Systems" />
    <meta name="twitter:description" content="Custom websites, social media management, and custom systems or apps for businesses in any industry, including food businesses. One trusted team." />
    <meta name="twitter:image" content="https://www.conect-r.com/opengraph.jpg" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('conectr-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
